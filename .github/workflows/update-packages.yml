name: Update packages

on:
  repository_dispatch:
  release:
    types: [published]
  push:
    branches: [master]
  schedule:
    - cron: '0 */12 * * *'
  watch:
    types: [started]
  workflow_dispatch:
    inputs:
      target:
        description: Package branch to update
        type: choice
        required: true
        default: packages-25.12
        options:
          - packages-25.12
          - packages
          - packages-19.07
          - packages-21.02
          - all

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  GIT_TERMINAL_PROMPT: '0'

jobs:
  build:
    if: github.event_name != 'watch' || github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: Update ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.target == 'all') && '["packages","packages-19.07","packages-21.02","packages-25.12"]' || format('["{0}"]', inputs.target)) }}
    concurrency:
      group: update-packages-${{ github.repository }}-${{ matrix.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install git subversion wget rsync
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Generate packages in a temporary directory
        id: generate
        run: |
          staging="$(mktemp -d "$RUNNER_TEMP/packages-${TARGET}.XXXXXX")"
          cd "$staging"
          bash -eo pipefail "$GITHUB_WORKSPACE/${TARGET}.sh"
          if [[ -z "$(find . -mindepth 2 -type f -name Makefile -print -quit)" ]]; then
            echo '::error::No package Makefiles were generated; refusing to publish.'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/LICENSE" "$staging/LICENSE"
          cp "$GITHUB_WORKSPACE/README.md" "$staging/README.md"
          if [[ "$TARGET" == packages-25.12 ]]; then
            cp "$GITHUB_WORKSPACE/packages-25.12.sh" \
              "$GITHUB_WORKSPACE/sources-25.12.tsv" \
              "$GITHUB_WORKSPACE/sources-25.12-coverage.tsv" "$staging/"
            cp -a "$GITHUB_WORKSPACE/docs" "$staging/"
            cp -a "$GITHUB_WORKSPACE/packages-25.12-overrides" "$staging/"
          fi
          printf 'directory=%s\n' "$staging" >> "$GITHUB_OUTPUT"

      - name: Publish the completed package snapshot
        env:
          STAGING: ${{ steps.generate.outputs.directory }}
        run: |
          publish="$(mktemp -d "$RUNNER_TEMP/publish-${TARGET}.XXXXXX")"
          cleanup() {
            git worktree remove --force "$publish" || true
          }
          trap cleanup EXIT

          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET" > /dev/null; then
            git fetch --no-tags --depth=1 origin "refs/heads/$TARGET"
            git worktree add --detach "$publish" FETCH_HEAD
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then
              echo '::error::Failed to check the destination branch.'
              exit "$status"
            fi
            git worktree add --detach "$publish" HEAD
            git -C "$publish" switch --orphan "publish-${TARGET}"
          fi

          rsync --archive --delete --exclude=.git "$STAGING/" "$publish/"
          git -C "$publish" add --all
          if git -C "$publish" diff --cached --quiet; then
            echo "No package changes for $TARGET."
            exit 0
          fi
          git -C "$publish" commit -m "update$(date +@%Y%m%d)"
          git -C "$publish" push origin "HEAD:refs/heads/$TARGET"
